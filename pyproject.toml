[project]
name = "pdfstruct"
version = "0.3.0"
description = "Extractor de documentos a Markdown de alta calidad. Soporta PDFs con PyMuPDF4LLM + GLM-OCR via Ollama y otros formatos con MarkItDown. Incluye validación cruzada, enriquecimiento y configuración YAML visible."
authors = [{name = "Julio César + Grok"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markitdown[all]>=0.1.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.5",
    "pdfplumber>=0.11.0",
    "pyyaml>=6.0.0",
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.0.0",
    "ruff>=0.4.0",
]
hybrid = [
    "ultralytics>=8.0.0",
    "huggingface_hub>=0.20.0",
    "Pillow>=10.0.0",
]

[project.scripts]
pdfstruct = "pdfstruct.cli:app"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: tests que requieren recursos externos o corpus de PDFs reales",
    "slow: tests que pueden tardar varios segundos o minutos",
]
