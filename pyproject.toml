[project]
name = "pdfstruct"
version = "0.1.0"
description = "Extractor de documentos a Markdown de alta calidad. Soporta cualquier formato de MarkItDown. En PDFs aplica lógica avanzada de imágenes, páginas y cruce de información."
authors = [{name = "Julio César + Grok"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markitdown[all]>=0.1.0",
    "pymupdf>=1.24.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
pdfstruct = "pdfstruct.cli:app"

[tool.setuptools.packages.find]
where = ["."]